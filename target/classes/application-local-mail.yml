spring:
  mail:
    # Microsoft 365 configuration for local development
    host: smtp.office365.com
    port: 587
    username: contact@careridesolutionspa.com
    password: Transportation1@@
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          from: contact@careridesolutionspa.com
          starttls:
            enable: true
            required: true
          # Additional Microsoft 365 specific settings
          ssl:
            protocols: "TLSv1.2"
          socketFactory:
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: true

