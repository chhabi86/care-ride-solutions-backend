
server:
  port: 8080
# Optional external secrets file (not committed) can be added as application-secrets.yml
# spring.config.import: optional:classpath:application-secrets.yml
# Deploy with corrected MAIL_USERNAME GitHub secret
spring:
  datasource:
    # Prefer full SPRING_DATASOURCE_URL if provided, otherwise build from DB_* pieces (default service name 'db').
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:caredb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:careuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:changeme_db_password}}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
  flyway:
    enabled: false
  mail:
    # Environment-based SMTP configuration
    # Local: Microsoft 365, Production: Amazon SES
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:contact@careridesolutionspa.com}
    password: ${MAIL_PASSWORD:Transportation1@@}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          from: ${MAIL_FROM:contact@careridesolutionspa.com}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_TIMEOUT:10000}
        debug: ${MAIL_DEBUG:false}
# Custom notification recipient (MAIL_NOTIFY) is consumed directly via @Value in PublicController.
mail:
  notify: contact@careridesolutionspa.com

# SendGrid HTTP API Configuration
sendgrid:
  api:
    key: ${SENDGRID_API_KEY:}

jwt:
  secret: ${JWT_SECRET:CHANGE_ME}

# Actuator management (production)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: db
        liveness:
          include: ping
  health:
    mail:
      enabled: false
    db:
      enabled: true

